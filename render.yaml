# Render blueprint: one free Docker web service. Migrations run from the
# container entrypoint (the free plan ignores preDeployCommand).
services:
  - type: web
    name: inkthread-backend
    runtime: docker
    plan: free
    region: virginia
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BLOB_STORE
        value: postgres   # the samples' files; uploads are processed, not kept
      - key: UPLOAD_TTL_MINUTES
        value: "60"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: LLM_MODE
        value: live
      - key: LANGFUSE_PUBLIC_KEY   # tracing (spec 14); APP_ENV is the trace environment
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://us.cloud.langfuse.com
      - key: ADMIN_TOKEN
        sync: false
      - key: BASTION_SIGNING_KEY_PUBLIC   # platform contract v2 (spec 12)
        sync: false
      - key: INKTHREAD_FRONTEND_SIGNING_KEY_PUBLIC
        sync: false
      - key: DEMO_MODE
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: MAX_PAGES
        value: "30"
      - key: READ_MEMORY_LIMIT_MB
        value: "0"
