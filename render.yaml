# Render blueprint: one free Docker web service. Migrations run from the
# container entrypoint (the free plan ignores preDeployCommand).
services:
  - type: web
    name: inkthread-backend
    runtime: docker
    plan: free
    region: virginia
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BLOB_STORE
        value: postgres   # the samples' files; uploads are processed, not kept
      - key: UPLOAD_TTL_MINUTES
        value: "60"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: LLM_MODE
        value: live
      - key: ADMIN_TOKEN
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: MAX_PAGES
        value: "30"
      - key: READ_MEMORY_LIMIT_MB
        value: "0"
